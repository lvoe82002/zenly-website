name: upload-big-files

on:
  push:
    paths:
      - '.github/workflows/upload-big-files.yml'

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download source zip
        run: curl -fL --retry 3 -o /tmp/zenly.zip "https://aka.doubaocdn.com/s/EIAhWHQ0p5"

      - name: Extract global.css and package-lock.json
        run: |
          unzip -o /tmp/zenly.zip -d /tmp/zenly
          mkdir -p zenly-home-vue/src/assets/styles
          cp /tmp/zenly/zenly-home-vue/src/assets/styles/global.css zenly-home-vue/src/assets/styles/global.css
          cp /tmp/zenly/zenly-home-vue/package-lock.json zenly-home-vue/package-lock.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zenly-home-vue/src/assets/styles/global.css zenly-home-vue/package-lock.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "补齐 global.css 与 package-lock.json [skip ci]"
            git push
          fi
