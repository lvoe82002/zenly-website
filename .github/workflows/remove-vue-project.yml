name: remove-vue-project

on:
  push:
    paths:
      - '.github/workflows/remove-vue-project.yml'

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove zenly-home-vue directory
        run: |
          git rm -r zenly-home-vue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "删除 Vue 工程目录 [skip ci]"
          git push
