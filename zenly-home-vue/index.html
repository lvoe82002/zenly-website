<!DOCTYPE html>
<html lang="zh" style="background:#0b0b0d">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Manchi</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://s1.hdslb.com/bfs/static/jinkela/long/font/regular.css">
    <style>
        #boot-loading-box { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: 99999; }
        #boot-loading-box .loading-left-bg { position: absolute; top: 0; left: 0; width: 50%; height: 100%; background: #121212; }
        #boot-loading-box .loading-right-bg { position: absolute; top: 0; right: 0; width: 50%; height: 100%; background: #121212; }
        #boot-loading-box .spinner-box { width: 300px; height: 300px; display: flex; justify-content: center; align-items: center; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #boot-loading-box .loader { width: 64px; height: 64px; position: relative; }
        #boot-loading-box .inner { width: 100%; height: 100%; border-radius: 50%; position: absolute; border: 3px solid transparent; }
        #boot-loading-box .inner.one { border-top-color: #409eff; animation: boot-rotate-one 1s linear infinite; }
        #boot-loading-box .inner.two { border-right-color: #409eff; animation: boot-rotate-two 1s linear infinite; }
        #boot-loading-box .inner.three { border-bottom-color: #409eff; animation: boot-rotate-three 1s linear infinite; }
        @keyframes boot-rotate-one { 0% { transform: rotateX(35deg) rotateY(-45deg) rotateZ(0deg); } 100% { transform: rotateX(35deg) rotateY(-45deg) rotateZ(360deg); } }
        @keyframes boot-rotate-two { 0% { transform: rotateX(50deg) rotateY(10deg) rotateZ(0deg); } 100% { transform: rotateX(50deg) rotateY(10deg) rotateZ(360deg); } }
        @keyframes boot-rotate-three { 0% { transform: rotateX(35deg) rotateY(55deg) rotateZ(0deg); } 100% { transform: rotateX(35deg) rotateY(55deg) rotateZ(360deg); } }
        #boot-loading-box .loading-word { margin-top: 80px; text-align: center; color: #fff; position: absolute; }
        #boot-loading-box .loading-title { font-size: 22px; margin-bottom: 6px; }
        #boot-loading-box .loading-text { font-size: 14px; opacity: 0.75; }
    </style>
</head>
<body class="pre-blur">
    <div id="app">
        <div id="boot-loading-box">
            <div class="loading-left-bg"></div>
            <div class="loading-right-bg"></div>
            <div class="spinner-box">
                <div class="loader">
                    <div class="inner one"></div>
                    <div class="inner two"></div>
                    <div class="inner three"></div>
                </div>
                <div class="loading-word">
                    <p class="loading-title">阿修の主页</p><span class="loading-text">加载中…</span>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
